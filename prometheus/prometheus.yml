global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: 'backend-core'
    metrics_path: '/api/v2/metrics'
    static_configs:
      - targets: ['backend-core:3000']

  - job_name: 'python-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8000']
