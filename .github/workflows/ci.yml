name: Najmah AI Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-core

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: ./backend-core/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Run Unit Tests
      run: npm run test

    - name: Build Application
      run: npm run build

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: ./package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Run Unit Tests
      run: npm run test

    - name: Build Application
      run: npm run build
      env:
        # Provide dummy production values so the Vite build doesn't fail if they are strictly required
        VITE_SUPABASE_URL: "https://mock.supabase.co"
        VITE_SUPABASE_ANON_KEY: "mock_anon_key"
        VITE_BACKEND_URL: "https://api.najmah.ai"
