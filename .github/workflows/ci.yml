name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, guard & test (illustration coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: E2E guard — no auto-illustrate
        run: node scripts/test-no-auto-illustrate.mjs

      - name: Vitest with illustration coverage thresholds
        run: bunx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-illustration
          path: coverage/
          if-no-files-found: ignore
