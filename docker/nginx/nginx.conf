# Production NGINX Reverse Proxy Configuration for Najmah AI Platform

upstream frontend_app {
    server frontend:80;
}

upstream backend_gateway {
    server backend-core:3000;
}

# ── HTTP Server (Redirects to HTTPS in production) ──
server {
    listen 80;
    server_name _;

    # Certbot webroot validation endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy HTTP traffic to frontend SPA
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API calls to NestJS API Gateway
    location /api/ {
        proxy_pass http://backend_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for AI long-running operations
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check probe for load balancers
    location /health {
        proxy_pass http://backend_gateway/api/v2/health/ready;
        proxy_set_header Host $host;
    }

    # ── Security Headers & Compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
